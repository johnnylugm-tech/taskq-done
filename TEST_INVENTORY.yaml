# TEST_INVENTORY.yaml — P1 Naming Authority
# Maps every FR/NFR acceptance criterion (TRACEABILITY_MATRIX §1) to exactly one
# expected test function. These names are the AUTHORITATIVE names that
# derive_test_cases.md preserves in TEST_SPEC.md (P2 single source of truth).
# Specified per FR and per test category (unit/integration/static).
# If no name is specified for a category, derive_test_cases.md fills the gap with
# names derived via the 7-Question Protocol.
#
# 1:1 mapping rule with TRACEABILITY_MATRIX.md §1:
#   - Every tc_id enumerated in the matrix is its own entry in `tests:`.
#   - Range syntax (e.g. TC-XX-NNa..g) is shorthand; here each sub-case is a
#     separate `- tc_id: TC-XX-NNa` entry with its own ac + test_function.
#   - Sub-cases that the matrix splits with ` · ` (e.g. AC-1.6 cursor + limit)
#     become tc_ids with suffix a/b/c and stay as independent contract items.
#   - Cross-cutting coverage is signalled via metadata
#     (cross_ref_frs / cross_ref_nfrs), NOT by collapsing entries.
#
# Coverage summary arithmetic:
#   - by_fr.<FR>.tc_count MUST equal count(tc_ids with fr == <FR>).
#   - by_layer.<L>.count MUST equal count(tc_ids with layer == <L>).
#   - These MUST equal total_test_cases (no arithmetic drift).
format_version: "1.1"

